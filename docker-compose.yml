version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/ecommerce
    networks:
      - ecommerce-network
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    ports:
      - "3000:3000"
    networks:
      - ecommerce-network
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: mongo:7
    container_name: ecommerce-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ecommerce
    networks:
      - ecommerce-network
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
